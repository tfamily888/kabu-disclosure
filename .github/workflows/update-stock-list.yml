name: Update Stock List (JPX)

on:
  schedule:
    # 毎月1日 09:00 JST (= 00:00 UTC)
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas 'xlrd<2.0'

      - name: Update stock list
        run: python update_stock_list.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_stocks.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update stock list from JPX $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
